# Blue-Green reverse proxy.
#
# The live colour is NOT hard-coded here. deploy.ps1 writes
# /etc/nginx/bluegreen/active.conf  ->  set $app_upstream app-blue|app-green;
# and reloads nginx, so this file never changes between deployments.

# Docker's embedded DNS. Re-resolving the container name means a recreated
# container (new IP) is picked up without restarting nginx.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;

    include /etc/nginx/bluegreen/active.conf;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://$app_upstream:9000;
        proxy_connect_timeout 2s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header X-Served-By $app_upstream always;
    }
}
